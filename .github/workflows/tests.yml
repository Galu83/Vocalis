name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Seules les bibliothèques importées au chargement des modules sont nécessaires
      # aux tests (pas Whisper, Parakeet, Piper ni les bibliothèques NVIDIA).
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "PySide6>=6.8" "requests>=2.31"
          python -m pip install -r requirements-dev.txt
      # Vérifications de pyflakes ; flake8 respecte les « # noqa » du code.
      - name: Pyflakes
        run: python -m flake8 --select=F vocalis tests
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
